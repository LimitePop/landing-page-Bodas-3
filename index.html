<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Límite Pop — Bodas</title>
<style>
  :root{
    --pink:#e34fb4;
    --white:#f5f5f5;
    --muted:#c9c9c9;
    --bg:#050505;
  }

  *{box-sizing:border-box}

  html{scroll-behavior:smooth}

  body{
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family:Arial, Helvetica, sans-serif;
  }

  /* Cabecera mínima: solo identidad, sin menú */
  header{
    height:78px;
    display:flex;
    align-items:center;
    padding:0 7vw;
    border-bottom:1px solid rgba(255,255,255,.08);
  }

  .logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:.02em;
  }

  /* HERO */
  .hero{
    min-height:calc(100vh - 78px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 30px 100px;
    background:
      radial-gradient(circle at 50% 35%, rgba(227,79,180,.07), transparent 38%),
      #050505;
  }

  .hero-inner{
    width:min(1250px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    margin:0 0 28px;
    color:#fff;
    font-size:18px;
    font-weight:600;
    letter-spacing:.24em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    color:var(--pink);
    font-size:clamp(48px, 5.2vw, 76px);
    line-height:.98;
    letter-spacing:-.045em;
    font-weight:900;
    white-space:nowrap;
  }

  .subtitle{
    margin:34px 0 0;
    max-width:850px;
    color:#ededed;
    font-size:clamp(21px, 2vw, 27px);
    line-height:1.35;
    font-weight:500;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:38px;
    min-height:58px;
    padding:0 34px;
    border-radius:999px;
    background:#fff;
    color:#090909;
    text-decoration:none;
    font-size:16px;
    font-weight:800;
    letter-spacing:.01em;
    transition:transform .2s ease, box-shadow .2s ease;
  }

  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(255,255,255,.12);
  }

  .proof{
    margin-top:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px 30px;
    color:#e5e5e5;
    font-size:19px;
    font-weight:700;
  }

  .proof span{white-space:nowrap}

  .stars{
    letter-spacing:2px;
    font-size:21px;
  }

  /* Solo para comprobar visualmente que el CTA funciona */
  .test-section{
    min-height:380px;
    padding:100px 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.08);
  }

  .test-section h2{
    margin:0;
    color:var(--pink);
    font-size:42px;
  }

  @media (max-width:900px){
    header{
      padding:0 24px;
    }

    .hero{
      min-height:calc(100vh - 78px);
      padding:65px 20px 80px;
    }

    h1{
      white-space:normal;
      font-size:clamp(45px, 9vw, 68px);
    }

    .eyebrow{
      font-size:15px;
      letter-spacing:.18em;
    }

    .subtitle{
      font-size:21px;
    }

    .proof{
      font-size:17px;
      gap:10px 18px;
    }
  }

  @media (max-width:520px){
    header{height:68px}

    .logo{font-size:19px}

    .hero{
      min-height:calc(100vh - 68px);
      padding-top:55px;
    }

    h1{
      font-size:47px;
      line-height:1.02;
    }

    .subtitle{
      margin-top:26px;
      font-size:19px;
    }

    .cta{
      width:100%;
      max-width:330px;
    }

    .proof{
      flex-direction:column;
      gap:9px;
      font-size:17px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="logo">LÍMITE POP</div>
</header>

<main>
  <section class="hero">
    <div class="hero-inner">

      <p class="eyebrow">MÚSICA EN DIRECTO PARA BODAS</p>

      <h1>VUESTRA BODA OCURRE UNA VEZ.</h1>

      <p class="subtitle">
        La música hará que la recordéis para siempre.
      </p>

      <a class="cta" href="#disponibilidad">
        COMPROBAR DISPONIBILIDAD
      </a>

      <div class="proof" aria-label="Datos de experiencia">
        <span>+250 canciones</span>
        <span>+500 conciertos</span>
        <span>+100 valoraciones <span class="stars">★★★★★</span></span>
      </div>

    </div>
  </section>

  <section id="disponibilidad" class="test-section">
    <h2>Disponibilidad</h2>
  </section>
</main>

</body>
</html>
